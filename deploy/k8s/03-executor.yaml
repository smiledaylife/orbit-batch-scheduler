# Executor Service：通过普通 ClusterIP Service 暴露，服务发现/负载均衡由 Kubernetes Service 负责。
apiVersion: v1
kind: Service
metadata:
  name: orbit-executor
  namespace: orbit-system
spec:
  selector:
    app: orbit-executor
  ports:
    - name: http
      port: 8081
      targetPort: 8081
---
# Executor 生产部署：至少两个副本，避免单 Pod 故障导致整个执行能力不可用。
# 同一 logId 的重复触发由 Redis 幂等保护；执行结果由 Redis Stream 持久化。
apiVersion: apps/v1
kind: Deployment
metadata:
  name: orbit-executor
  namespace: orbit-system
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      # 滚动升级期间保证至少保留一个可用 Executor。
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: orbit-executor
  template:
    metadata:
      labels:
        app: orbit-executor
    spec:
      # 给 callback flush 和任务执行线程预留优雅退出时间。
      terminationGracePeriodSeconds: 30
      affinity:
        podAntiAffinity:
          # 尽量把副本分散到不同节点，降低单节点故障影响面。
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app: orbit-executor
      containers:
        - name: executor
          image: orbit-executor-sample:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8081
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            # 普通 Service 负责在多个 Executor Pod 间做服务级负载均衡。
            - name: ORBIT_EXECUTOR_ADMIN_ADDRESSES
              value: http://orbit-admin:8080
            - name: ORBIT_EXECUTOR_APP_NAME
              value: demo-executor
            - name: ORBIT_EXECUTOR_ACCESS_TOKEN
              valueFrom:
                secretKeyRef:
                  name: orbit-admin-secret
                  key: executor-access-token
            # Redis SETNX 幂等 key 防止 HTTP 超时重试造成重复执行。
            - name: ORBIT_EXECUTOR_EXECUTION_IDEMPOTENCY_ENABLED
              value: "true"
            - name: ORBIT_EXECUTOR_EXECUTION_IDEMPOTENCY_TTL_SECONDS
              value: "86400"
            # Redis Stream 持久化 callback，Admin 侧异步消费并落库。
            - name: ORBIT_EXECUTOR_DURABLE_CALLBACK_ENABLED
              value: "true"
            - name: SPRING_REDIS_HOST
              valueFrom:
                secretKeyRef:
                  name: orbit-admin-secret
                  key: redis-host
            - name: SPRING_REDIS_PORT
              valueFrom:
                secretKeyRef:
                  name: orbit-admin-secret
                  key: redis-port
            - name: SPRING_REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: orbit-admin-secret
                  key: redis-password
            - name: ORBIT_EXECUTOR_WORKER_THREADS
              value: "8"
            - name: ORBIT_EXECUTOR_QUEUE_CAPACITY
              value: "256"
          volumeMounts:
            - name: conf
              mountPath: /app/config
          args: ["--spring.config.additional-location=file:/app/config/executor.yml"]
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8081
            initialDelaySeconds: 8
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8081
            initialDelaySeconds: 20
            periodSeconds: 10
          resources:
            # requests 用于调度，limits 用于限制异常负载对节点的影响。
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 1000m
              memory: 256Mi
      volumes:
        - name: conf
          configMap:
            name: orbit-config
            items:
              - key: executor.yml
                path: executor.yml

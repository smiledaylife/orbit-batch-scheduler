apiVersion: v1
kind: Service
metadata:
  name: orbit-executor
  namespace: orbit-system
spec:
  selector:
    app: orbit-executor
  ports:
    - name: http
      port: 8081
      targetPort: 8081
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: orbit-executor
  namespace: orbit-system
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: orbit-executor
  template:
    metadata:
      labels:
        app: orbit-executor
    spec:
      terminationGracePeriodSeconds: 30
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app: orbit-executor
      containers:
        - name: executor
          image: orbit-executor-sample:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8081
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: ORBIT_EXECUTOR_ADMIN_ADDRESSES
              value: http://orbit-admin:8080
            - name: ORBIT_EXECUTOR_APP_NAME
              value: demo-executor
            - name: ORBIT_EXECUTOR_ACCESS_TOKEN
              valueFrom:
                secretKeyRef:
                  name: orbit-admin-secret
                  key: executor-access-token
            - name: ORBIT_EXECUTOR_EXECUTION_IDEMPOTENCY_ENABLED
              value: "true"
            - name: ORBIT_EXECUTOR_EXECUTION_IDEMPOTENCY_TTL_SECONDS
              value: "86400"
            - name: ORBIT_EXECUTOR_DURABLE_CALLBACK_ENABLED
              value: "true"
            - name: SPRING_REDIS_HOST
              valueFrom:
                secretKeyRef:
                  name: orbit-admin-secret
                  key: redis-host
            - name: SPRING_REDIS_PORT
              valueFrom:
                secretKeyRef:
                  name: orbit-admin-secret
                  key: redis-port
            - name: SPRING_REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: orbit-admin-secret
                  key: redis-password
            - name: ORBIT_EXECUTOR_WORKER_THREADS
              value: "8"
            - name: ORBIT_EXECUTOR_QUEUE_CAPACITY
              value: "256"
          volumeMounts:
            - name: conf
              mountPath: /app/config
          args: ["--spring.config.additional-location=file:/app/config/executor.yml"]
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8081
            initialDelaySeconds: 8
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8081
            initialDelaySeconds: 20
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 1000m
              memory: 256Mi
      volumes:
        - name: conf
          configMap:
            name: orbit-config
            items:
              - key: executor.yml
                path: executor.yml

# ---------------------------------------------------------------------------
# 常规 Service（ClusterIP）：管理 API / HTTP 派发统一入口
# Kubernetes Service + EndpointSlice 负责 Pod 负载均衡与故障摘除
# ---------------------------------------------------------------------------
apiVersion: v1
kind: Service
metadata:
  name: orbit-scheduler
  namespace: orbit-system
  labels:
    app: orbit-scheduler
spec:
  type: ClusterIP
  selector:
    app: orbit-scheduler
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      protocol: TCP

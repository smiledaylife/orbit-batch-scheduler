apiVersion: v1
kind: Service
metadata:
  name: orbit-admin
  namespace: orbit-system
spec:
  selector:
    app: orbit-admin
  ports:
    - name: http
      port: 8080
      targetPort: 8080
---
# 调度中心：无状态 Deployment。
# 生产多副本必须使用 cluster profile + 外部 PostgreSQL/GaussDB + Quartz JDBC JobStore + Redis。
apiVersion: apps/v1
kind: Deployment
metadata:
  name: orbit-admin
  namespace: orbit-system
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: orbit-admin
  template:
    metadata:
      labels:
        app: orbit-admin
    spec:
      terminationGracePeriodSeconds: 45
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app: orbit-admin
      containers:
        - name: admin
          image: orbit-admin:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: SPRING_PROFILES_ACTIVE
              value: cluster
            - name: ORBIT_ADMIN_ACCESS_TOKEN
              valueFrom:
                secretKeyRef:
                  name: orbit-admin-secret
                  key: access-token
            - name: ORBIT_DB_URL
              valueFrom:
                secretKeyRef:
                  name: orbit-admin-secret
                  key: db-url
            - name: ORBIT_DB_USER
              valueFrom:
                secretKeyRef:
                  name: orbit-admin-secret
                  key: db-user
            - name: ORBIT_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: orbit-admin-secret
                  key: db-password
            - name: ORBIT_REDIS_HOST
              valueFrom:
                secretKeyRef:
                  name: orbit-admin-secret
                  key: redis-host
            - name: ORBIT_REDIS_PORT
              valueFrom:
                secretKeyRef:
                  name: orbit-admin-secret
                  key: redis-port
            - name: ORBIT_REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: orbit-admin-secret
                  key: redis-password
          volumeMounts:
            - name: conf
              mountPath: /app/config
              readOnly: true
          args: ["--spring.config.additional-location=file:/app/config/admin.yml"]
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 512Mi
      volumes:
        - name: conf
          configMap:
            name: orbit-config
            items:
              - key: admin.yml
                path: admin.yml

apiVersion: v1
kind: Service
metadata:
  name: orbit-admin
  namespace: orbit-system
spec:
  selector:
    app: orbit-admin
  ports:
    - name: http
      port: 8080
      targetPort: 8080
---
# 调度中心：无状态 Deployment。
# 执行器心跳写入共享库 orbit_executor_registry（对齐 XXL-JOB xxl_job_registry），
# 任意副本都能读到全量在线节点。执行器只需 ORBIT_EXECUTOR_ADMIN_ADDRESSES=http://orbit-admin:8080。
# 多副本调度（同一 Cron 只触发一次）仍需 Quartz JDBC 集群：
#   1. SPRING_PROFILES_ACTIVE=cluster
#   2. PostgreSQL / GaussDB + deploy/sql/quartz-*.sql
#   3. 副本时钟 NTP 同步
apiVersion: apps/v1
kind: Deployment
metadata:
  name: orbit-admin
  namespace: orbit-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: orbit-admin
  template:
    metadata:
      labels:
        app: orbit-admin
    spec:
      containers:
        - name: admin
          image: orbit-admin:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          volumeMounts:
            - name: data
              mountPath: /app/data
            - name: conf
              mountPath: /app/config
          args: ["--spring.config.additional-location=file:/app/config/admin.yml"]
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 512Mi
      volumes:
        - name: data
          emptyDir: {}
        - name: conf
          configMap:
            name: orbit-config
            items:
              - key: admin.yml
                path: admin.yml

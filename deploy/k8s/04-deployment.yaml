# ---------------------------------------------------------------------------
# 应用部署：2 副本（多副本验证集群防重 / HTTP 跨 Pod 派发）
# ---------------------------------------------------------------------------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: orbit-scheduler
  namespace: orbit-system
  labels:
    app: orbit-scheduler
spec:
  replicas: 2
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0     # 滚动更新期间保底 1 副本在线，Quartz 集群状态迁移更平滑
      maxSurge: 1
  selector:
    matchLabels:
      app: orbit-scheduler
  template:
    metadata:
      labels:
        app: orbit-scheduler
    spec:
      terminationGracePeriodSeconds: 45   # 优雅停机：等待任务收尾 + Quartz check-out
      containers:
        - name: orbit-scheduler
          image: orbit-scheduler-sample:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            # Pod 名作为节点 ID（执行日志中的 dispatchNode/workerNode）
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            # 数据库连接（主机/端口按实际环境调整）
            # postgresql 模式（默认）：PG 实例 Service
            # gaussdb 模式：改为 GaussDB/OpenGauss 实例地址（如 gaussdb.orbit-system.svc.cluster.local:5432）
            # mysql 模式：改为 mysql.orbit-system.svc.cluster.local:3306
            - name: DB_HOST
              value: postgresql.orbit-system.svc.cluster.local
            - name: DB_PORT
              value: "5432"
            - name: DB_NAME
              value: orbit_scheduler
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: orbit-scheduler-secret
                  key: DB_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: orbit-scheduler-secret
                  key: DB_PASSWORD
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            initialDelaySeconds: 40
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 4
          volumeMounts:
            - name: config
              mountPath: /app/config
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: orbit-scheduler-config

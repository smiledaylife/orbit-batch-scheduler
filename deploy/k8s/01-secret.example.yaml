apiVersion: v1
kind: Secret
metadata:
  name: orbit-admin-secret
  namespace: orbit-system
type: Opaque
stringData:
  # 所有值均为示例。生产环境请通过 Secret 管理系统或 GitOps secret 注入，禁止提交真实凭据。
  access-token: CHANGE_ME
  db-url: jdbc:postgresql://postgres.example:5432/orbit_admin
  db-user: orbit_admin
  db-password: CHANGE_ME_DB_PASSWORD
  redis-host: redis.example
  redis-port: "6379"
  redis-password: CHANGE_ME_REDIS_PASSWORD

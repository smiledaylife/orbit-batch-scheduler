apiVersion: v1
kind: ConfigMap
metadata:
  name: orbit-config
  namespace: orbit-system
data:
  admin.yml: |
    server:
      port: 8080
    spring:
      datasource:
        url: jdbc:h2:file:/app/data/orbit-admin;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
        driver-class-name: org.h2.Driver
        username: sa
        password:
      sql:
        init:
          mode: always
          schema-locations: classpath:schema.sql
      quartz:
        job-store-type: memory
    orbit:
      admin:
        access-token: ""
        heartbeat-timeout-seconds: 90
        timezone: Asia/Shanghai
  executor.yml: |
    server:
      port: 8081
    orbit:
      executor:
        enabled: true
        app-name: demo-executor
        admin-addresses: http://orbit-admin:8080
        # 端口默认自动感知 server.port，无需额外显式配置
        # K8s 下 address 留空，框架将自动读取 POD_IP 并拼接端口完成注册
        address: ""
        heartbeat-interval-ms: 20000
        node-id: ${POD_NAME:}

apiVersion: v1
kind: ConfigMap
metadata:
  name: orbit-config
  namespace: orbit-system
data:
  admin.yml: |
    server:
      port: 8080
    spring:
      datasource:
        type: com.alibaba.druid.pool.DruidDataSource
        url: ${ORBIT_DB_URL}
        driver-class-name: ${ORBIT_DB_DRIVER:org.postgresql.Driver}
        username: ${ORBIT_DB_USER}
        password: ${ORBIT_DB_PASSWORD}
        druid:
          initial-size: 5
          min-idle: 5
          max-active: 20
          max-wait: 60000
          validation-query: SELECT 1
          test-while-idle: true
          time-between-eviction-runs-millis: 60000
          min-evictable-idle-time-millis: 300000
      redis:
        host: ${ORBIT_REDIS_HOST}
        port: ${ORBIT_REDIS_PORT:6379}
        password: ${ORBIT_REDIS_PASSWORD:}
        database: ${ORBIT_REDIS_DATABASE:0}
        timeout: ${ORBIT_REDIS_TIMEOUT:2s}
        connect-timeout: ${ORBIT_REDIS_CONNECT_TIMEOUT:2s}
        lettuce:
          pool:
            max-active: 16
            max-idle: 8
            min-idle: 2
            max-wait: 2s
      quartz:
        job-store-type: jdbc
        jdbc:
          initialize-schema: never
        properties:
          org.quartz.scheduler.instanceName: orbit-admin
          org.quartz.scheduler.instanceId: AUTO
          org.quartz.threadPool.threadCount: 10
          org.quartz.jobStore.driverDelegateClass: ${ORBIT_QUARTZ_DELEGATE:org.quartz.impl.jdbcjobstore.PostgreSQLDelegate}
          org.quartz.jobStore.tablePrefix: QRTZ_
          org.quartz.jobStore.isClustered: true
          org.quartz.jobStore.clusterCheckinInterval: 15000
          org.quartz.jobStore.misfireThreshold: 60000
    orbit:
      admin:
        access-token: ${ORBIT_ADMIN_ACCESS_TOKEN}
        heartbeat-timeout-seconds: 90
        timezone: Asia/Shanghai
        execution-lease-enabled: true
        execution-lease-ttl-ms: 120000
        execution-lease-renew-interval-ms: 30000
        durable-callback-enabled: true
        callback-stream-key: orbit:callback:stream
        callback-stream-group: orbit-admin
        quartz-reconcile-interval-ms: 60000
        quartz-reconcile-initial-delay-ms: 15000
  executor.yml: |
    server:
      port: 8081
    spring:
      redis:
        host: ${SPRING_REDIS_HOST}
        port: ${SPRING_REDIS_PORT:6379}
        password: ${SPRING_REDIS_PASSWORD:}
    orbit:
      executor:
        enabled: true
        app-name: demo-executor
        admin-addresses: http://orbit-admin:8080
        access-token: ${ORBIT_EXECUTOR_ACCESS_TOKEN}
        durable-callback-enabled: true
        callback-stream-key: orbit:callback:stream
        execution-idempotency-enabled: true
        execution-idempotency-ttl-seconds: 86400
        address: ""
        heartbeat-interval-ms: 20000
        node-id: ${POD_NAME:}

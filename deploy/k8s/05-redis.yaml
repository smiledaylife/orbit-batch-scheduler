# ---------------------------------------------------------------------------
# 演示用单实例 Redis（分布式锁后端）
# 生产环境请替换为高可用 Redis（哨兵/集群版），并通过 REDIS_ADDRESS 环境变量覆盖地址
# ---------------------------------------------------------------------------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: orbit-redis
  namespace: orbit-system
  labels:
    app: orbit-redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: orbit-redis
  template:
    metadata:
      labels:
        app: orbit-redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          ports:
            - containerPort: 6379
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: orbit-system
  labels:
    app: orbit-redis
spec:
  type: ClusterIP
  selector:
    app: orbit-redis
  ports:
    - name: redis
      port: 6379
      targetPort: 6379

# ============================================================
# DS-V2 执行器配置（plt-mgmt 定时任务迁移）
# 基线：JDK 21 + Spring Boot 3.5 + orbit-executor SDK
# 说明：
#   - 迁移后由 orbit-admin（调度中心）统一触发，本工程不再自带 @Scheduled 线程池；
#   - 数据源指向 plt-mgmt 管理端库（pweb001db），表 tb_pmctl_auth_notice /
#     tb_pmctl_auth_function / tb_connection_info / tb_configuration_version 等；
#   - Redis 使用 gatewayRedis 集群（与 plt-mgmt 一致）。
# ============================================================
server:
  port: 8020
  shutdown: graceful

spring:
  application:
    name: dsv2
  threads:
    virtual:
      enabled: true
  batch:
    job:
      enabled: false               # 禁止启动时自动执行 Job，仅由 @OrbitJob handler 显式触发
    jdbc:
      initialize-schema: never     # DSV2_BATCH_* 表由 DBA 手工创建；同库旧版 BATCH_* 生产表不可动
      table-prefix: DSV2_BATCH_    # 元数据表前缀隔离（batchMetadataCleanup 任务同样基于该前缀）
      # PostgreSQL 上 JobRepository 默认 SERIALIZABLE 会在多任务准点并发时触发 SSI 冲突，
      # 官方建议改为 READ_COMMITTED（JobInstance 唯一性由 JOB_INST_UN 唯一约束保证）
      isolation-level-for-create: read_committed

# ---- dsv2 自定义配置（均可被环境变量覆盖，如 DSV2_BATCH_METADATA_RETENTION_DAYS） ----
dsv2:
  batch:
    metadata:
      retention-days: 180          # batchMetadataCleanup 保留天数
  ssh:
    strict-host-key-checking: "no" # ConfigCheck ROCKET_MQ 分支 SSH 主机密钥校验；生产配好 known_hosts 后建议改为 "yes"

# 外部配置注入方式：K8s 原生 envFrom（ConfigMap → 普通配置，Secret → 凭据），
# 不使用 spring-cloud-kubernetes（无该依赖；改配置后滚动重启 Pod 生效）。
# Spring Boot 宽松绑定：spring.datasource.url ← SPRING_DATASOURCE_URL，以此类推。
# 以下键必须由外部配置提供（无默认值）：
#   spring.datasource.{url,username,password}            业务库 pweb001db
#   spring.datasource.batch.{url,username,password}      批元数据库 pbat001db
#   spring.data.redis.cluster.nodes / spring.data.redis.password
#   spring.kafka.bootstrap-servers
#   jasypt.encryptor.password                            SM4 密钥（仅 Secret 注入）
#   pvc.backup.path / plt.localFileDirRoot
#   orbit.executor.{admin-addresses,app-name,access-token}

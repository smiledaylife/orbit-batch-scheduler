# 本工作流用 Maven 构建 Java 项目，并缓存依赖以加速后续执行。
# 参考：https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-java-with-maven

name: Java CI with Maven

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  # 允许在 GitHub Actions 页面手动点击触发
  workflow_dispatch:

# 最小权限原则：仅需读取仓库代码
permissions:
  contents: read

# 同一分支/PR 有新提交时，自动取消正在排队的旧构建，节省 CI 资源
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 检出代码
      - name: Checkout repository
        uses: actions/checkout@v4

      # 配置 JDK 11（对齐调度中心与 Docker 构建环境基线）
      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'
          cache: maven

      # 执行 Maven 编译、打包与全模块测试
      # -B: 批处理（非交互）模式
      # -ntp: 关闭依赖下载进度条，日志更清爽
      # verify: 跑完各模块的单元测试与打包验证
      - name: Build with Maven
        run: mvn -B -ntp verify --file pom.xml

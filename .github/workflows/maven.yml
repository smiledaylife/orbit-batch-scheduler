# 本工作流用 Maven 构建 Java 项目，并缓存依赖以加速后续执行。
# 参考：https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-java-with-maven

name: Java CI with Maven

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  # 允许在 GitHub Actions 页面手动点击触发
  workflow_dispatch:

# 最小权限原则：仅需读取仓库代码
permissions:
  contents: read

# 同一分支/PR 有新提交时，自动取消正在排队的旧构建，节省 CI 资源
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 检出代码
      - name: Checkout repository
        uses: actions/checkout@v4

      # 配置 JDK 21（对齐调度中心与 Docker 构建环境基线）
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      # 执行 Maven 编译、打包与全模块测试
      # -B: 批处理（非交互）模式
      # -ntp: 关闭依赖下载进度条，日志更清爽
      # verify: 跑完各模块的单元测试与打包验证
      - name: Build with Maven
        shell: bash
        run: |
          set -o pipefail
          mvn -B -ntp verify --file pom.xml 2>&1 | tee build.log

      # 构建失败时，把编译错误 / 失败用例摘要以 annotation 形式贴到 Checks 页
      - name: Summarize build errors
        if: failure()
        shell: bash
        run: |
          grep -E '\[ERROR\]|<<< (FAILURE|ERROR)!|Tests run:.*(Failures: [1-9]|Errors: [1-9])' build.log \
            | grep -vE 'Re-run Maven|For more information|\[Help [0-9]+\]|^\[ERROR\] *$' \
            | head -n 60 > errors.log || true
          if [ -s errors.log ]; then
            split -l 6 -d errors.log chunk_
            for f in chunk_*; do
              msg=$(sed ':a;N;$!ba;s/\n/%0A/g' "$f")
              echo "::error title=Maven build failed::${msg}"
            done
          fi
          { echo '## Maven 构建失败摘要'; echo '```'; cat errors.log; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: maven-build-log
          path: build.log
          retention-days: 7

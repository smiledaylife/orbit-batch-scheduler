server:
  port: 8081
  shutdown: graceful

spring:
  application:
    name: orbit-executor-sample
  # JDK 21 虚拟线程（Boot 3.2+）：Tomcat 请求处理改为虚拟线程每请求一线，
  # 触发入口在业务高峰下不再占用平台线程；如需回退置为 false。
  threads:
    virtual:
      enabled: true

  # ---- 引入 Redis（可选集群级能力，三步走，详见 README「4.4 引入 Redis」）----
  # 第 1 步：在本模块 pom.xml 取消 spring-boot-starter-data-redis 的注释
  #         （orbit-executor 将其声明为 optional，不会传递进来必须由业务侧显式引入）；
  # 第 2 步：配置下面的连接信息；第 3 步：开启 orbit.executor 下的两个 Redis 开关。
  # 不引入 Redis 也能完整运行：SDK 自动降级为 JVM 本地幂等 + 纯 HTTP 回传，
  # 也不会激活 Redis 健康探针。
  # data:
  #   redis:
  #     host: 127.0.0.1
  #     port: 6379
  #     password: ""
  #     database: 0
  #     timeout: 2s
  #     connect-timeout: 2s

orbit:
  executor:
    enabled: true
    app-name: demo-executor
    # 调度中心地址（本地默认 8080；K8s 改为 http://orbit-admin:8080）
    admin-addresses: http://127.0.0.1:8080
    # address 为空则自动探测：K8s 下用 POD_IP，本地用本机 IP；端口默认自动继承 server.port，无需显式配置
    address: ""
    # port 默认继承 server.port（无需配置），仅在 Docker 端口映射宿主机等特殊场景需覆盖时指定
    # port: 8081
    access-token: ""
    heartbeat-interval-ms: 20000
    node-id: ${POD_NAME:}
    # 任务工作线程池：单节点并发上限 + 按任务超时强制中断（消除僵尸任务）。下限为 1。
    worker-threads: 8
    # 排队队列容量：队列满时新触发同步返回 executor saturated（调度中心立刻判失败）
    # 0 = 不排队：并发超过 worker-threads 立即快速失败
    queue-capacity: 256
    # 任务工作线程改用 JDK 21 虚拟线程（默认 false = 平台线程）。
    # 有界并发/排队/超时中断语义不变；适合 HTTP/DB 等 IO 密集任务；
    # 业务 handler 大量使用 synchronized 阻塞时建议保持默认（JDK 21 下 synchronized 会钉住载体线程）。
    worker-virtual-threads: false
    # ---- 执行结果回传（触发是异步的，任务成败只能靠回传送达调度中心）----
    # 回传失败的重试次数（不含首次）与退避间隔；重试耗尽会打 ERROR，
    # 对应日志将由调度中心的孤儿回收兜底判失败
    callback-retry-times: 3
    callback-retry-interval-ms: 2000

    # ---- 引入 Redis（第 3 步）：两项可选集群级能力，需先完成上面注释里的第 1、2 步 ----
    # 执行幂等：同 logId 在 TTL 内整个执行器集群最多进入一次执行线程池（跨副本 SET NX + TTL）；
    # 未引入 Redis 时自动降级为 JVM 本地实现（仅保护本节点，TTL 上限 300 秒）。
    # execution-idempotency-enabled: true
    # execution-idempotency-ttl-seconds: 86400
    # 持久化回传：执行结果先写 Redis Stream（执行器进程重启不丢），
    # 由 admin 侧消费组异步落库（admin 需同步开启 durable-callback-enabled）；
    # Redis 不可用时自动降级回 HTTP 回传。
    # durable-callback-enabled: true
    # callback-stream-key: orbit:callback:stream

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    com.orbit: INFO

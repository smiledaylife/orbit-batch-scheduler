server:
  port: 8081
  shutdown: graceful

spring:
  application:
    name: orbit-executor-sample

orbit:
  executor:
    enabled: true
    app-name: demo-executor
    # 调度中心地址（本地默认 8080；K8s 改为 http://orbit-admin:8080）
    admin-addresses: http://127.0.0.1:8080
    # address 为空则自动探测：K8s 下用 POD_IP，本地用本机 IP；端口默认自动继承 server.port，无需显式配置
    address: ""
    # port 默认继承 server.port（无需配置），仅在 Docker 端口映射宿主机等特殊场景需覆盖时指定
    # port: 8081
    access-token: ""
    heartbeat-interval-ms: 20000
    node-id: ${POD_NAME:}
    # 任务工作线程池：单节点并发上限 + 按任务超时强制中断（消除僵尸任务）。下限为 1。
    worker-threads: 8
    # 排队队列容量：队列满时新触发同步返回 executor saturated（调度中心立刻判失败）
    # 0 = 不排队：并发超过 worker-threads 立即快速失败
    queue-capacity: 256
    # ---- 执行结果回传（触发是异步的，任务成败只能靠回传送达调度中心）----
    # 回传失败的重试次数（不含首次）与退避间隔；重试耗尽会打 ERROR，
    # 对应日志将由调度中心的孤儿回收兜底判失败
    callback-retry-times: 3
    callback-retry-interval-ms: 2000
    # 待回传队列容量：满则丢弃最旧一条并打 ERROR
    callback-queue-capacity: 1000

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    com.orbit: INFO

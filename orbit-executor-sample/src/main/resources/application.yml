server:
  port: 8081
  shutdown: graceful

spring:
  application:
    name: orbit-executor-sample

orbit:
  executor:
    enabled: true
    app-name: demo-executor
    # 调度中心地址（本地默认 8080；K8s 改为 http://orbit-admin:8080）
    admin-addresses: http://127.0.0.1:8080
    # address 为空则自动探测：K8s 下用 POD_IP，本地用本机 IP；端口默认自动继承 server.port，无需显式配置
    address: ""
    # port 默认继承 server.port（无需配置），仅在 Docker 端口映射宿主机等特殊场景需覆盖时指定
    # port: 8081
    access-token: ""
    heartbeat-interval-ms: 20000
    node-id: ${POD_NAME:}
    # 任务工作线程池：单节点并发上限 + 按任务超时强制中断（消除调度中心超时放弃后的僵尸任务）
    # worker-threads: 0 可退回旧版「在请求线程内联执行、无超时强制」的行为
    worker-threads: 8
    # 排队队列容量：队列满时新触发快速失败（调度中心可观测到并扩容副本）
    queue-capacity: 256

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    com.orbit: INFO

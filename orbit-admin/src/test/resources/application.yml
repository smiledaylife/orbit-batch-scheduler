# 测试专用配置：使用内存 H2（PostgreSQL 兼容模式），Druid 连接池
spring:
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    url: jdbc:h2:mem:orbit-admin;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
    # test-while-idle 默认开启，必须配 validation-query，
    # 否则每次建池都会打印 "testWhileIdle is true, validationQuery not set"
    druid:
      validation-query: SELECT 1
      test-while-idle: true
      initial-size: 1
      min-idle: 1
      max-active: 5
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: AUTO

orbit:
  admin:
    access-token: ""
    heartbeat-timeout-seconds: 90
    max-timeout-seconds: 3600
    executor-address-allow-pattern: ""
    # 注册表缓存关闭：保证每个测试方法读到的都是最新落库状态
    registry-cache-ttl-ms: 0
    log-retention-days: 30

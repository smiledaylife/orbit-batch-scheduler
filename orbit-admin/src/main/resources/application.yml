server:
  port: 8080
  shutdown: graceful

spring:
  application:
    name: orbit-admin
  datasource:
    # 使用 Druid 数据库连接池（druid-spring-boot-starter 自动装配，type 可省略，显式声明更清晰）
    type: com.alibaba.druid.pool.DruidDataSource
    # 默认嵌入式 H2（PostgreSQL 兼容模式），开箱即用；生产库可配置为 PostgreSQL 或 GaussDB
    url: jdbc:h2:file:./data/orbit-admin;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1;AUTO_SERVER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:
    # --- PostgreSQL 生产配置参考 ---
    # url: jdbc:postgresql://localhost:5432/orbit_admin
    # driver-class-name: org.postgresql.Driver
    # username: postgres
    # password: your_password
    # --- GaussDB / openGauss 生产配置参考 ---
    # url: jdbc:opengauss://localhost:5432/orbit_admin
    # driver-class-name: org.opengauss.Driver
    # username: gaussdb
    # password: your_password
    druid:
      initial-size: 2
      min-idle: 2
      max-active: 20
      max-wait: 60000
      validation-query: SELECT 1
      test-while-idle: true
      test-on-borrow: false
      test-on-return: false
      time-between-eviction-runs-millis: 60000
      min-evictable-idle-time-millis: 300000
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql
  # 注意：quartz / lifecycle 必须挂在 spring 下。
  # 曾经误缩进到 mybatis-plus 之下，导致这些键被绑定成 mybatis-plus.quartz.*，
  # Spring Boot 对未知属性静默忽略 —— 配置不报错也不生效。
  quartz:
    job-store-type: memory
    properties:
      org.quartz.scheduler.instanceName: orbit-admin
      org.quartz.scheduler.instanceId: AUTO
      org.quartz.threadPool.threadCount: 10
  lifecycle:
    timeout-per-shutdown-phase: 30s

# MyBatis-Plus 配置
mybatis-plus:
  configuration:
    # 下划线列名 -> 驼峰属性名（job_name -> jobName）
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      # 主键自增（配合 BIGSERIAL）
      id-type: AUTO

orbit:
  admin:
    access-token: ""
    heartbeat-timeout-seconds: 90
    connect-timeout-ms: 3000
    read-timeout-ms: 300000
    group: ORBIT
    timezone: Asia/Shanghai
    evict-interval-ms: 30000
    # 单个任务允许的最大执行超时（秒）。用于给派发调用设上限，
    # 避免手动触发/定时派发长时间占住 Tomcat 线程或 Quartz 工作线程。
    max-timeout-seconds: 3600
    # 执行器注册地址白名单（Java 正则，匹配整个 address）。
    # 留空表示不启用白名单，仅做协议/链路本地地址等基础校验。
    # 生产环境建议收紧，例如：^https?://orbit-executor[a-z0-9-]*\.svc\.cluster\.local(:\d+)?$
    executor-address-allow-pattern: ""

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true

logging:
  level:
    com.orbit: INFO

server:
  port: 8080
  shutdown: graceful

spring:
  application:
    name: orbit-admin
  datasource:
    # 默认嵌入式 H2（PostgreSQL 兼容模式），开箱即用；生产库可配置为 PostgreSQL 或 GaussDB
    url: jdbc:h2:file:./data/orbit-admin;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1;AUTO_SERVER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:
    # --- PostgreSQL 生产配置参考 ---
    # url: jdbc:postgresql://localhost:5432/orbit_admin
    # driver-class-name: org.postgresql.Driver
    # username: postgres
    # password: your_password
    # --- GaussDB / openGauss 生产配置参考 ---
    # url: jdbc:opengauss://localhost:5432/orbit_admin
    # driver-class-name: org.opengauss.Driver
    # username: gaussdb
    # password: your_password
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql
  quartz:
    job-store-type: memory
    properties:
      org.quartz.scheduler.instanceName: orbit-admin
      org.quartz.scheduler.instanceId: AUTO
      org.quartz.threadPool.threadCount: 10
  lifecycle:
    timeout-per-shutdown-phase: 30s

orbit:
  admin:
    access-token: ""
    heartbeat-timeout-seconds: 90
    connect-timeout-ms: 3000
    read-timeout-ms: 300000
    group: ORBIT
    timezone: Asia/Shanghai
    evict-interval-ms: 30000

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true

logging:
  level:
    com.orbit: INFO

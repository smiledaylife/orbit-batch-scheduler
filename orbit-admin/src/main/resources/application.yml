server:
  port: 8080
  shutdown: graceful

spring:
  application:
    name: orbit-admin
  datasource:
    # 使用 Druid 数据库连接池（druid-spring-boot-starter 自动装配，type 可省略，显式声明更清晰）
    type: com.alibaba.druid.pool.DruidDataSource
    # 默认嵌入式 H2（PostgreSQL 兼容模式），开箱即用；生产库可配置为 PostgreSQL 或 GaussDB
    url: jdbc:h2:file:./data/orbit-admin;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1;AUTO_SERVER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:
    # --- PostgreSQL 生产配置参考 ---
    # url: jdbc:postgresql://localhost:5432/orbit_admin
    # driver-class-name: org.postgresql.Driver
    # username: postgres
    # password: your_password
    # --- GaussDB / openGauss 生产配置参考 ---
    # url: jdbc:opengauss://localhost:5432/orbit_admin
    # driver-class-name: org.opengauss.Driver
    # username: gaussdb
    # password: your_password
    druid:
      initial-size: 2
      min-idle: 2
      max-active: 20
      max-wait: 60000
      validation-query: SELECT 1
      test-while-idle: true
      test-on-borrow: false
      test-on-return: false
      time-between-eviction-runs-millis: 60000
      min-evictable-idle-time-millis: 300000
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql

# MyBatis-Plus 配置
mybatis-plus:
  configuration:
    # 下划线列名 -> 驼峰属性名（job_name -> jobName）
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      # 主键自增（配合 BIGSERIAL）
      id-type: AUTO
  quartz:
    job-store-type: memory
    properties:
      org.quartz.scheduler.instanceName: orbit-admin
      org.quartz.scheduler.instanceId: AUTO
      org.quartz.threadPool.threadCount: 10
  lifecycle:
    timeout-per-shutdown-phase: 30s

orbit:
  admin:
    access-token: ""
    heartbeat-timeout-seconds: 90
    connect-timeout-ms: 3000
    read-timeout-ms: 300000
    group: ORBIT
    timezone: Asia/Shanghai
    evict-interval-ms: 30000

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true

logging:
  level:
    com.orbit: INFO

# ---------------------------------------------------------------------------
# gaussdb 模式：生产形态（华为 GaussDB / openGauss）
#   与 postgresql 模式唯一差异 = 连接串与驱动；代码与表结构完全一致（同一 JAR 双库运行）
#   首次部署需执行 deploy/sql/schema-gaussdb.sql 初始化表结构
#     （业务表主键为 SEQUENCE：seq_job_config_id / seq_job_log_id，
#       应用侧 GaussDB 方言自动走 SELECT nextval 预取 + 显式 id 插入）
#   建库（DBA）：CREATE DATABASE orbit_scheduler DBCOMPATIBILITY = 'A' ENCODING 'UTF8';
#
#   driverDelegateClass 无需配置：框架按方言自动注入 GaussDBDelegate
#   （继承官方 PostgreSQLDelegate，差异抹平说明见 GaussDBDelegate javadoc）
# ---------------------------------------------------------------------------
spring:
  datasource:
    # openGauss 官方驱动（org.opengauss:opengauss-jdbc）
    # 华为云 GaussDB 亦可用官方 gaussdbjdbc 驱动：
    #   url: jdbc:gaussdb://host:5432/db  +  driver-class-name: com.huawei.gaussdb.jdbc.Driver
    url: jdbc:opengauss://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:orbit_scheduler}?currentSchema=public
    username: ${DB_USER:orbit}
    password: ${DB_PASSWORD:orbit123}
    driver-class-name: org.opengauss.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 5000
  sql:
    init:
      mode: never

  quartz:
    job-store-type: jdbc
    jdbc:
      initialize-schema: never
    properties:
      org.quartz.scheduler.instanceName: orbit-scheduler
      org.quartz.scheduler.instanceId: AUTO
      # org.quartz.jobStore.driverDelegateClass 由框架按方言自动注入（GaussDBDelegate）；
      # 此处显式配置亦可覆盖框架注入（用户配置优先）
      org.quartz.jobStore.isClustered: true
      org.quartz.jobStore.clusterCheckinInterval: 15000
      org.quartz.jobStore.misfireThreshold: 60000
      org.quartz.threadPool.threadCount: 10
      org.quartz.threadPool.threadNamePrefix: orbit-quartz-

orbit:
  scheduler:
    storage:
      type: database
    database:
      dialect: auto              # auto | gaussdb | postgresql（探测不可靠时手动指定）
    lock:
      enabled: true
      type: auto                # 配置 redis.address 时用 Redis，否则数据库锁
      lease: 10m
      # redis:
      #   address: ${REDIS_ADDRESS:redis:6379}   # 需要启用 Redis 锁时打开
    http-dispatch:
      enabled: true
      service-name: orbit-scheduler
      discovery-mode: service-dns
      port: 8080
      # secret: change-me                       # 生产建议开启派发令牌
    log:
      storage: database

# ---------------------------------------------------------------------------
# standalone 模式：零外部依赖
#   Quartz 内存 JobStore + 任务内存存储 + 无分布式锁 + 纯本地调度
#   适用：本地开发体验、单机轻量调度、功能演示
# ---------------------------------------------------------------------------
spring:
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration

  quartz:
    job-store-type: memory
    properties:
      org.quartz.scheduler.instanceName: orbit-scheduler
      org.quartz.scheduler.instanceId: AUTO
      org.quartz.threadPool.threadCount: 5
      org.quartz.threadPool.threadNamePrefix: orbit-quartz-

orbit:
  scheduler:
    storage:
      type: memory
    lock:
      enabled: false
    http-dispatch:
      enabled: false
    log:
      storage: memory

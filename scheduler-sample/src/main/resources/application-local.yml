# ---------------------------------------------------------------------------
# local 模式：H2 内存数据库（MySQL 兼容模式）
#   Quartz JDBC JobStore + 任务数据库存储 + JDBC 分布式锁 + HTTP 自调度演示
#   适用：无 MySQL/Redis 环境下体验完整数据库链路，重启数据即清
# ---------------------------------------------------------------------------
spring:
  datasource:
    url: jdbc:h2:mem:orbit_scheduler;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  sql:
    init:
      mode: always
      schema-locations: classpath:sql/schema-h2.sql
  h2:
    console:
      enabled: true
      path: /h2-console

  quartz:
    job-store-type: jdbc
    jdbc:
      initialize-schema: always
    properties:
      org.quartz.scheduler.instanceName: orbit-scheduler
      org.quartz.scheduler.instanceId: AUTO
      org.quartz.jobStore.driverDelegateClass: org.quartz.impl.jdbcjobstore.StdJDBCDelegate
      org.quartz.jobStore.isClustered: false
      org.quartz.jobStore.misfireThreshold: 60000
      org.quartz.threadPool.threadCount: 5

orbit:
  scheduler:
    storage:
      type: database
    lock:
      enabled: true
      type: database            # H2 行锁演示（无 Redis）
    http-dispatch:
      enabled: true
      static-endpoints:
        - http://127.0.0.1:8080 # 单节点：HTTP 派发自环回演示
    log:
      storage: database

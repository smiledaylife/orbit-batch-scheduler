spring:
  application:
    name: orbit-scheduler-sample
  profiles:
    active: standalone
  lifecycle:
    timeout-per-shutdown-phase: 30s

server:
  port: 8080
  shutdown: graceful

# ---------------------------------------------------------------------------
# Orbit Batch Scheduler 公共配置（各 profile 可覆盖）
# ---------------------------------------------------------------------------
orbit:
  scheduler:
    enabled: true
    group: ORBIT
    node-id: ${POD_NAME:}
    timezone: Asia/Shanghai
    annotation-scan: true
    api-enabled: true
    storage:
      type: auto                # auto | database | memory
    lock:
      enabled: true
      type: auto                # auto | redis | database | none
      lease: 10m
    http-dispatch:
      enabled: true
      service-name: orbit-scheduler
      discovery-mode: service-dns
      port: 8080
      path: /api/scheduler/execute
      connect-timeout: 3s
      read-timeout: 300s
      default-timeout-seconds: 300
    # 跨服务批量调度：注册可被 REMOTE / WORKFLOW 编排的外部业务服务
    # 生产环境将 service-name 改为 K8s Service DNS；本地联调可用 base-url / static-endpoints
    remote-services:
      order-service:
        service-name: order-service
        port: 8080
        path-prefix: ""
        default-method: POST
        # base-url: http://order-service:8080   # 可选，优先于 DNS
        # static-endpoints:                     # 本地联调
        #   - http://127.0.0.1:8081
      inventory-service:
        service-name: inventory-service
        port: 8080
        default-method: POST
      report-service:
        service-name: report-service
        port: 8080
        default-method: POST
    log:
      storage: auto             # auto | database | memory
      memory-capacity: 1000

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true

logging:
  level:
    com.orbit.scheduler: INFO
